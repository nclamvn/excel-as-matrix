# Render Blueprint for ExcelAI
# https://render.com/docs/blueprint-spec
# Note: Root directory should be left empty (code is at repo root)

services:
  - type: web
    name: excelai
    runtime: static
    rootDir: ""
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_OPENAI_API_KEY
        sync: false  # Set manually in Render dashboard
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=31536000
      - path: /index.html
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
